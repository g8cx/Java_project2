apply plugin: 'com.android.application'

android {
    namespace 'com.example.victorina' // Замените на ваше пространство имен
    compileSdk 33 // или ваша версия

    defaultConfig {
        applicationId "com.example.victorina" // Замените на ваше applicationId
        minSdk 21 // или ваша версия
        targetSdk 33 // или ваша версия
        versionCode 1
        versionName "1.0"
    }
    compileSdkVersion 33 // Убедитесь, что версия актуальна

    defaultConfig {
        applicationId "com.example.quizapp"
        minSdkVersion 21 // Минимальная версия Android
        targetSdkVersion 33 // Целевая версия Android
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // Поддержка совместимости
    implementation 'androidx.core:core-ktx:1.10.0' // Kotlin Extensions
    implementation 'com.google.android.material:material:1.9.0' // Material Design
    testImplementation 'junit:junit:4.13.2' // Для юнит-тестирования
    androidTestImplementation 'androidx.test.ext:junit:1.1.5' // Для тестирования Android
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' // Espresso для UI тестирования
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"
}
